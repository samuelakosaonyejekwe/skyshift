name: Refresh NASA data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"       # daily: also refreshes the CDN mirror
    - cron: "17 6,12,18 * * *" # every 6 hours: fresh SPHEREx index
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet numpy

      - name: Pull fresh NASA data (IRSA SPHEREx, JPL, Exoplanet Archive, NASA.gov)
        env:
          # code-only pushes reuse the latest published data (deploys in ~2 min);
          # scheduled and manual runs do the full refresh
          SKYSHIFT_REUSE: ${{ github.event_name == 'push' && '1' || '' }}
          # if an upstream service is down, the last good copy is restored from
          # the live site, then from the CDN mirror of the data branch
          SKYSHIFT_PREVIOUS: >-
            ${{ env.SITE_URL }}/data/
            https://cdn.jsdelivr.net/gh/${{ github.repository }}@data/
            https://raw.githubusercontent.com/${{ github.repository }}/data/
        run: python3 tools/build_data.py site/data

      - name: Include the Android app download
        run: |
          mkdir -p site/download
          git fetch -q origin app:app 2>/dev/null && git show app:skyshift.apk > site/download/skyshift.apk && git show app:skyshift.apk.sha256 > site/download/skyshift.apk.sha256 \
            && ls -la site/download || echo "No Android app build yet"

      - name: Minify app code for fast loading
        run: |
          npx --yes esbuild@0.23.1 site/js/*.js --minify --outdir=site/js --allow-overwrite --log-level=warning
          npx --yes esbuild@0.23.1 site/css/app.css --minify --outfile=site/css/app.css --allow-overwrite --log-level=warning

      - name: Stamp app version (changes only when app code changes)
        run: |
          v=$(find site -path site/data -prune -o -type f -print | sort | xargs sha1sum | sha1sum | cut -c1-12)
          sed -i "s/__BUILD__/$v/" site/sw.js
          touch site/.nojekyll
          echo "App version $v"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mirror the data to the `data` branch (served by jsDelivr for the backup host)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *'
        run: |
          set -e
          tmp=$(mktemp -d)
          cp -r site/data/. "$tmp"/
          rm -rf "$tmp/packs"   # keep the CDN mirror under jsDelivr's size limit
          cd "$tmp"
          git init -q -b data
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          for f in meta.json coverage.json movers.json sso.json ephem.json exoplanets.json news.json images.json cad.json; do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/$f" || true
          done

      # ---- independent second host (activates when its secret is set) ----
      - name: Deploy to Cloudflare Pages (second host)
        continue-on-error: true   # a backup-host problem must never block the main site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No Cloudflare token set; skipping."; exit 0; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # look the account up with the token itself
            CLOUDFLARE_ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')")
            export CLOUDFLARE_ACCOUNT_ID
            [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::warning::Cloudflare account not found: add the CLOUDFLARE_ACCOUNT_ID secret (or give the token 'Account Settings: Read')"; exit 1; }
          fi
          npx --yes wrangler@3 pages project create skyshift --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@3 pages deploy site --project-name skyshift --branch main --commit-dirty=true

      - name: Deploy to Netlify (second host)
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then echo "No Netlify token set; skipping."; exit 0; fi
          npx --yes netlify-cli@17 deploy --dir site --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "SkyShift refresh"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    # GitHub pauses scheduled workflows after 60 days without repository
    # activity; re-enabling through the API keeps the refresh running forever
    # without making any commits.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
