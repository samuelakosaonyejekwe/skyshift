name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "site/manifest.webmanifest", "site/icons/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare Bubblewrap (Trusted Web Activity builder)
        run: |
          npm install -g @bubblewrap/cli@1.25.0
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build the signed app (targets the latest Android)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p build && cd build
          echo "$KEYSTORE_B64" | base64 -d > skyshift.keystore
          code=$(( ${{ github.run_number }} + 100 ))
          sed -e "s/__VERSION_CODE__/$code/" -e "s/__VERSION_NAME__/1.0.$code/" ../android/twa-manifest.template.json > twa-manifest.json
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          # target the newest Android SDK available on the build machine
          latest=$(ls "$ANDROID_HOME/platforms" | sed 's/android-//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "Newest Android platform available: $latest"
          sed -i -E "s/(compileSdkVersion|targetSdkVersion|compileSdk|targetSdk)[ =]+[0-9]+/\1 $latest/" app/build.gradle || true
          grep -E "compileSdk|targetSdk|minSdk" app/build.gradle || true
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          ls -la *.apk *.aab
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2 dump badging app-release-signed.apk | grep -E "package:|targetSdkVersion|sdkVersion" || true

      - name: Publish the app file to the `app` branch
        run: |
          set -e
          tmp=$(mktemp -d)
          cp build/app-release-signed.apk "$tmp/skyshift.apk"
          cp build/app-release-bundle.aab "$tmp/skyshift.aab" 2>/dev/null || true
          (cd "$tmp" && sha256sum skyshift.apk | cut -d' ' -f1 > skyshift.apk.sha256)
          cd "$tmp"
          git init -q -b app
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Android app build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" app

      - name: Publish the site with the new app
        run: gh workflow run deploy.yml -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
